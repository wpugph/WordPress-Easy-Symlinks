<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <!-- Symlink chain icon -->
  <g transform="translate(128,118)">
    <!-- Link 1 -->
    <g transform="rotate(-45)">
      <rect x="-65" y="-20" width="75" height="40" rx="20" fill="none" stroke="#FFDC28" stroke-width="10"/>
    </g>
    <!-- Link 2 -->
    <g transform="rotate(-45)">
      <rect x="-10" y="-20" width="75" height="40" rx="20" fill="none" stroke="#ffffff" stroke-width="10"/>
    </g>
  </g>
  <!-- Arrow indicator -->
  <g transform="translate(128,178)">
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#FFDC28" stroke-width="7" stroke-linecap="round"/>
    <polyline points="12,-9 22,0 12,9" fill="none" stroke="#FFDC28" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
