<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- WP Admin background -->
  <rect width="1200" height="900" fill="#f0f0f1"/>

  <!-- Card container -->
  <rect x="80" y="60" width="1040" height="780" rx="12" fill="#ffffff" stroke="#ddd" stroke-width="1"/>

  <!-- Title -->
  <text x="120" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1d2327">Easy Symlinks Management</text>

  <!-- Environment banner -->
  <rect x="120" y="140" width="960" height="80" rx="8" fill="#f7f5e8" stroke="#FFDC28" stroke-width="2"/>
  <text x="150" y="175" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Pantheon Dev</text>
  <text x="150" y="200" font-family="system-ui, sans-serif" font-size="14" fill="#555">Connection mode: SFTP | Filesystem: Writable</text>

  <!-- Green writable indicator -->
  <circle cx="920" cy="175" r="10" fill="#46b450"/>
  <text x="940" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#46b450">Writable</text>

  <!-- Divider -->
  <line x1="120" y1="250" x2="1080" y2="250" stroke="#eee" stroke-width="1"/>

  <!-- Read-only example -->
  <rect x="120" y="280" width="960" height="80" rx="8" fill="#fef1f1" stroke="#dc3545" stroke-width="2"/>
  <text x="150" y="315" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Pantheon Live</text>
  <text x="150" y="340" font-family="system-ui, sans-serif" font-size="14" fill="#555">This plugin cannot be used in Test and Live Read-only Environments</text>

  <!-- Red indicator -->
  <circle cx="920" cy="315" r="10" fill="#dc3545"/>
  <text x="940" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#dc3545">Read-only</text>

  <!-- Divider -->
  <line x1="120" y1="390" x2="1080" y2="390" stroke="#eee" stroke-width="1"/>

  <!-- Local env example -->
  <rect x="120" y="420" width="960" height="80" rx="8" fill="#f0f8f0" stroke="#46b450" stroke-width="2"/>
  <text x="150" y="455" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Local Development</text>
  <text x="150" y="480" font-family="system-ui, sans-serif" font-size="14" fill="#555">Filesystem: Writable</text>
  <circle cx="920" cy="455" r="10" fill="#46b450"/>
  <text x="940" y="460" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#46b450">Writable</text>
</svg>
