<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- WP Admin background -->
  <rect width="1200" height="900" fill="#f0f0f1"/>

  <!-- Card container -->
  <rect x="80" y="60" width="1040" height="780" rx="12" fill="#ffffff" stroke="#ddd" stroke-width="1"/>

  <!-- Title -->
  <text x="120" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1d2327">Easy Symlinks Management</text>

  <!-- Tabs -->
  <rect x="120" y="140" width="160" height="40" rx="20" fill="#e0e0e0"/>
  <text x="155" y="166" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#666">Add Symlinks</text>
  <rect x="295" y="140" width="180" height="40" rx="20" fill="#FFDC28"/>
  <text x="325" y="166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Delete Symlinks</text>

  <!-- Delete section -->
  <text x="120" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1d2327">Select symlink to delete</text>
  <text x="120" y="252" font-family="system-ui, sans-serif" font-size="13" fill="#888">Choose a symlink from the dropdown to remove it</text>

  <!-- Dropdown -->
  <rect x="120" y="268" width="960" height="46" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.5"/>
  <text x="138" y="297" font-family="system-ui, sans-serif" font-size="15" fill="#333">/wp-content/wflogs -> ./wp-content/uploads/wflogs</text>
  <!-- Dropdown arrow -->
  <polyline points="1050,285 1060,295 1070,285" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"/>

  <!-- Delete button -->
  <rect x="120" y="340" width="190" height="44" rx="8" fill="#dc3545"/>
  <text x="160" y="368" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Delete Symlink</text>

  <!-- Success notification -->
  <rect x="120" y="420" width="960" height="50" rx="6" fill="#f0faf0" stroke="#46b450" stroke-width="1.5"/>
  <text x="150" y="451" font-family="system-ui, sans-serif" font-size="15" fill="#2e7d32">Symlink deleted successfully.</text>

  <!-- Existing symlinks -->
  <text x="120" y="520" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1d2327">Existing Symlinks:</text>
  <text x="120" y="555" font-family="monospace" font-size="14" fill="#555">/wp-content/cache -> ./wp-content/uploads/cache</text>
</svg>
